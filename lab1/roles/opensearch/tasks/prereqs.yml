---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name: "{{ opensearch_prereq_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set vm.max_map_count (required by OpenSearch)
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ opensearch_vm_max_map_count }}"
    sysctl_file: /etc/sysctl.d/99-opensearch.conf
    state: present
    reload: true
