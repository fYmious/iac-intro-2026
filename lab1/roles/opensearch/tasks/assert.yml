---
- name: Check that the target system and parameters are supported
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['architecture'] in opensearch_arch_map
      - opensearch_admin_password | length >= 8
    fail_msg: >-
      Role supports Debian/Ubuntu on x86_64/aarch64 and requires
      opensearch_admin_password (min. 8 chars, pass it via ansible-vault).
    quiet: true

- name: Check passwords of the security users
  ansible.builtin.assert:
    that:
      - opensearch_writer_password | length >= 8
      - opensearch_reader_password | length >= 8
      - opensearch_operator_password | length >= 8
    fail_msg: >-
      Set opensearch_writer_password, opensearch_reader_password and
      opensearch_operator_password (min. 8 chars, pass them via ansible-vault).
    quiet: true
  when: opensearch_security_manage | bool
