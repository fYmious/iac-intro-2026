---
- name: Configure the data stream, roles and users through the REST API
  module_defaults:
    ansible.builtin.uri:
      url_username: admin
      url_password: "{{ opensearch_admin_password }}"
      force_basic_auth: true
      validate_certs: "{{ opensearch_validate_certs }}"
      body_format: json
  block:
    - name: Check whether the index template exists
      ansible.builtin.uri:
        url: "{{ opensearch_api_url }}/_index_template/{{ opensearch_index_template_name }}"
        status_code: [200, 404]
      register: opensearch_template_before

    - name: Create or update the index template for the data stream
      ansible.builtin.uri:
        url: "{{ opensearch_api_url }}/_index_template/{{ opensearch_index_template_name }}"
        method: PUT
        status_code: [200, 201]
        body: "{{ opensearch_index_template_body }}"
      changed_when: opensearch_template_before.status == 404

    - name: Check whether the data stream exists
      ansible.builtin.uri:
        url: "{{ opensearch_api_url }}/_data_stream/{{ opensearch_data_stream }}"
        status_code: [200, 404]
      register: opensearch_stream_before

    - name: Create the data stream
      ansible.builtin.uri:
        url: "{{ opensearch_api_url }}/_data_stream/{{ opensearch_data_stream }}"
        method: PUT
        status_code: [200, 201]
      when: opensearch_stream_before.status == 404

    - name: Create or update roles
      ansible.builtin.uri:
        url: "{{ opensearch_api_url }}/_plugins/_security/api/roles/{{ item.key }}"
        method: PUT
        status_code: [200, 201]
        body: "{{ item.value }}"
      loop: "{{ opensearch_security_roles | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: opensearch_roles_result
      changed_when: opensearch_roles_result.json.status | default('') == 'CREATED'

    - name: Create or update users
      ansible.builtin.uri:
        url: "{{ opensearch_api_url }}/_plugins/_security/api/internalusers/{{ item.name }}"
        method: PUT
        status_code: [200, 201]
        body:
          password: "{{ item.password }}"
          backend_roles: []
          attributes: {}
      loop: "{{ opensearch_security_users }}"
      loop_control:
        label: "{{ item.name }}"
      register: opensearch_users_result
      changed_when: opensearch_users_result.json.status | default('') == 'CREATED'
      no_log: true

    - name: Map roles to users
      ansible.builtin.uri:
        url: "{{ opensearch_api_url }}/_plugins/_security/api/rolesmapping/{{ item.role }}"
        method: PUT
        status_code: [200, 201]
        body:
          users:
            - "{{ item.name }}"
      loop: "{{ opensearch_security_users }}"
      loop_control:
        label: "{{ item.role }} to {{ item.name }}"
      register: opensearch_mapping_result
      changed_when: opensearch_mapping_result.json.status | default('') == 'CREATED'
