---
- name: Validate input parameters
  ansible.builtin.import_tasks: assert.yml
  tags: [opensearch, opensearch_assert]

- name: Prepare the system
  ansible.builtin.import_tasks: prereqs.yml
  tags: [opensearch, opensearch_prereqs]

- name: Install OpenSearch
  ansible.builtin.import_tasks: install.yml
  tags: [opensearch, opensearch_install]

- name: Configure OpenSearch
  ansible.builtin.import_tasks: configure.yml
  tags: [opensearch, opensearch_configure]

- name: Verify OpenSearch readiness
  ansible.builtin.import_tasks: verify.yml
  tags: [opensearch, opensearch_verify]

- name: Install and configure OpenSearch Dashboards
  ansible.builtin.import_tasks: dashboards.yml
  when: opensearch_dashboards_install | bool
  tags: [opensearch, opensearch_dashboards]
