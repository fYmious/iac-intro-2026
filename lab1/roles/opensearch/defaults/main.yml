---
opensearch_version: "3.8.0"
opensearch_dashboards_version: "{{ opensearch_version }}"
opensearch_download_base_url: "https://artifacts.opensearch.org/releases/bundle"

opensearch_dashboards_install: true

opensearch_admin_password: ""
opensearch_dashboards_os_user: "kibanaserver"
opensearch_dashboards_os_password: "kibanaserver"

opensearch_cluster_name: "opensearch-lab"
opensearch_node_name: "{{ inventory_hostname }}"
opensearch_network_host: "127.0.0.1"
opensearch_http_port: 9200
opensearch_dashboards_host: "0.0.0.0"
opensearch_dashboards_port: 5601

opensearch_heap_size: "1g"
opensearch_vm_max_map_count: 262144
opensearch_nofile_limit: 65535

opensearch_data_dir: "/var/lib/opensearch"
opensearch_log_dir: "/var/log/opensearch"

opensearch_extra_config: {}

opensearch_service_enabled: true
opensearch_service_state: "started"

opensearch_wait_retries: 30
opensearch_wait_delay: 10
opensearch_validate_certs: false
opensearch_expected_status: ["green", "yellow"]

opensearch_compliance_salt: "WN2yviiGAwWPWO3m"

opensearch_security_settings:
  plugins.security.ssl.transport.pemcert_filepath: esnode.pem
  plugins.security.ssl.transport.pemkey_filepath: esnode-key.pem
  plugins.security.ssl.transport.pemtrustedcas_filepath: root-ca.pem
  transport.ssl.enforce_hostname_verification: false
  plugins.security.ssl.http.enabled: true
  plugins.security.ssl.http.pemcert_filepath: esnode.pem
  plugins.security.ssl.http.pemkey_filepath: esnode-key.pem
  plugins.security.ssl.http.pemtrustedcas_filepath: root-ca.pem
  plugins.security.allow_unsafe_democertificates: true
  plugins.security.compliance.salt: "{{ opensearch_compliance_salt }}"
  plugins.security.allow_default_init_securityindex: true
  plugins.security.authcz.admin_dn: ["CN=kirk,OU=client,O=client,L=test,C=de"]
  plugins.security.audit.type: internal_opensearch
  plugins.security.enable_snapshot_restore_privilege: true
  plugins.security.check_snapshot_restore_write_privileges: true
  plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
  plugins.security.system_indices.enabled: true

opensearch_dashboards_extra_config: {}

opensearch_security_manage: true

opensearch_writer_password: ""
opensearch_reader_password: ""
opensearch_operator_password: ""

opensearch_data_stream: "logs"
opensearch_index_template_name: "logs-template"
opensearch_index_template_priority: 200
opensearch_data_stream_shards: 1
opensearch_data_stream_replicas: 0

opensearch_index_template_body:
  index_patterns: ["{{ opensearch_data_stream }}"]
  data_stream: {}
  priority: "{{ opensearch_index_template_priority }}"
  template:
    settings:
      number_of_shards: "{{ opensearch_data_stream_shards }}"
      number_of_replicas: "{{ opensearch_data_stream_replicas }}"
    mappings:
      properties:
        "@timestamp": { type: date }
        message: { type: text }
        level: { type: keyword }

opensearch_security_roles:
  logs_writer:
    cluster_permissions:
      - "indices:data/write/bulk"
    index_permissions:
      - index_patterns:
          - "{{ opensearch_data_stream }}"
          - ".ds-{{ opensearch_data_stream }}-*"
        allowed_actions:
          - "indices:data/write/index"
          - "indices:data/write/bulk*"
          - "indices:admin/mapping/auto_put"
  logs_reader:
    cluster_permissions: []
    index_permissions:
      - index_patterns:
          - "logs*"
        allowed_actions:
          - "read"
  cluster_operator:
    cluster_permissions:
      - "cluster_monitor"
      - "cluster:admin/settings/update"
    index_permissions: []

opensearch_security_users:
  - name: "writer"
    password: "{{ opensearch_writer_password }}"
    role: "logs_writer"
  - name: "reader"
    password: "{{ opensearch_reader_password }}"
    role: "logs_reader"
  - name: "operator"
    password: "{{ opensearch_operator_password }}"
    role: "cluster_operator"
